<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRON LOG">
<meta name="theme-color" content="#0a0a0a">
<title>IRON LOG</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Safe Area (iPhone 13 Pro: top 47px, bottom 34px / iPad 11 Pro: top 24px) ── */
:root{
  --bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;
  --border:#222;--border2:#2a2a2a;--border3:#333;
  --text:#e8e8e8;--text2:#aaa;--text3:#666;--text4:#444;
  --input-bg:#1a1a1a;--card-border:#1e1e1e;
  --today-dot:#fff;--logo-color:#fff;
  --sat: env(safe-area-inset-top, 47px);
  --sab: env(safe-area-inset-bottom, 34px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f5f5f5;--bg2:#fff;--bg3:#f0f0f0;--bg4:#e8e8e8;
    --border:#e0e0e0;--border2:#d8d8d8;--border3:#ccc;
    --text:#111;--text2:#444;--text3:#888;--text4:#aaa;
    --input-bg:#f0f0f0;--card-border:#e8e8e8;
    --today-dot:#111;--logo-color:#111;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;
  --border:#222;--border2:#2a2a2a;--border3:#333;
  --text:#e8e8e8;--text2:#aaa;--text3:#666;--text4:#444;
  --input-bg:#1a1a1a;--card-border:#1e1e1e;
  --today-dot:#fff;--logo-color:#fff;
}
:root[data-theme="light"]{
  --bg:#f5f5f5;--bg2:#fff;--bg3:#f0f0f0;--bg4:#e8e8e8;
  --border:#e0e0e0;--border2:#d8d8d8;--border3:#ccc;
  --text:#111;--text2:#444;--text3:#888;--text4:#aaa;
  --input-bg:#f0f0f0;--card-border:#e8e8e8;
  --today-dot:#111;--logo-color:#111;
}

html,body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR','Apple SD Gothic Neo',-apple-system,sans-serif;
  height:100%;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;user-select:none;
  transition:background .25s,color .25s;
}
#app{display:flex;height:100dvh;overflow:hidden}

/* ── SIDEBAR (iPad) ── */
#sidebar{width:260px;min-width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding-top:calc(var(--sat) + 20px);padding-left:calc(var(--sal) + 20px);padding-right:20px;padding-bottom:calc(var(--sab) + 20px);overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(max-width:767px){#sidebar{display:none!important}}
.sb-logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;letter-spacing:5px;color:var(--logo-color)}
.sb-user{display:flex;align-items:center;gap:8px;margin:8px 0 20px;padding:8px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3)}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.sb-avatar img{width:100%;height:100%;object-fit:cover}
.sb-user-info{flex:1;min-width:0}
.sb-user-name{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user-sub{font-size:10px;color:var(--text3)}
.sb-sync-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0}
.sb-sync-dot.off{background:var(--text4)}
.sb-section{font-size:10px;color:var(--text4);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;margin-top:4px}
.sb-day{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:all .15s}
.sb-day.rest{opacity:.3;pointer-events:none}
.sb-day.sel{background:var(--bg3);border-color:var(--day-color)}
.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--text4);flex-shrink:0;transition:background .15s}
.sb-day.sel .sb-dot{background:var(--day-color)}
.sb-day-name{font-size:12px;color:var(--text2)}
.sb-day.sel .sb-day-name{color:var(--day-color);font-weight:700}
.sb-day-sub{font-size:10px;color:var(--text4)}
.sb-today{margin-left:auto;font-size:8px;background:var(--text);color:var(--bg);padding:2px 5px;border-radius:8px;font-weight:700}
.sb-nav{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.sb-nav-btn{padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-size:12px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:8px}
.sb-nav-btn.act{background:var(--bg3);color:var(--text)}
.sb-nav-icon{font-size:16px;width:20px;text-align:center}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── MOBILE HEADER ── */
/* iPhone 13 Pro: Dynamic Island 없음, 노치 높이 ~47px */
#mh{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding-top:calc(var(--sat) + 10px);
  padding-left:16px;
  padding-right:16px;
  padding-bottom:0;
  flex-shrink:0;
}
@media(min-width:768px){#mh{display:none!important}}
.mh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh-logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:4px;color:var(--logo-color)}
.mh-user{display:flex;align-items:center;gap:6px;cursor:pointer}
.mh-avatar{width:26px;height:26px;border-radius:50%;background:var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px}
.mh-avatar img{width:100%;height:100%;object-fit:cover}
.mh-sync{width:6px;height:6px;border-radius:50%;background:#4ade80}
.mh-sync.off{background:var(--text4)}
.mh-tabs{display:flex}
.mh-tab{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text3);padding:9px 0;font-size:11px;cursor:pointer;font-family:inherit;transition:all .2s}
.mh-tab.act{color:var(--text);border-bottom-color:var(--text)}

/* ── SCROLL ── */
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── BOTTOM TABS ── */
#bt{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:var(--sab);flex-shrink:0}
@media(min-width:768px){#bt{display:none!important}}
.bt-btn{flex:1;background:transparent;border:none;padding:8px 0 6px;font-size:9px;color:var(--text4);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s}
.bt-btn.act{color:var(--text)}
.bt-icon{font-size:19px}

/* ── PAGES ── */
.page{display:none}.page.act{display:block}

/* ── LOGIN PAGE ── */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:40px 20px;text-align:center}
.login-logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:52px;letter-spacing:8px;color:var(--logo-color);margin-bottom:8px}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:48px;line-height:1.6}
.login-btn{display:flex;align-items:center;gap:10px;padding:14px 24px;border-radius:12px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;margin-bottom:12px;width:240px;justify-content:center}
.login-btn:hover{border-color:var(--border3);background:var(--bg3)}
.login-btn img{width:20px;height:20px}
.login-skip{font-size:11px;color:var(--text4);cursor:pointer;text-decoration:underline;margin-top:8px}

/* ── DAY ROW ── */
.day-row{display:flex;gap:5px;padding:14px 16px 0;justify-content:center}
.day-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;position:relative;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center}
.day-btn.rest{opacity:.3;pointer-events:none}
.day-btn.sel{border-width:2px;font-weight:700;background:var(--bg4)}
.today-dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--today-dot)}

/* ── ROUTINE HEADER ── */
.r-header{margin:14px 16px 0;padding:14px;background:var(--bg2);border-radius:12px;border:1px solid;display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(min-width:768px){.r-header{margin:18px 20px 0;padding:16px}}
.r-left{display:flex;flex-direction:column;gap:2px;min-width:0}
.r-icon-row{display:flex;align-items:center;gap:8px}
.r-icon{font-size:22px}
.r-label{font-size:16px;font-weight:700}
.r-desc{font-size:10px;color:var(--text3);margin-top:1px}
.r-edit{font-size:11px;color:var(--text4);margin-top:4px;cursor:pointer;padding:3px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);width:fit-content}
.prog-wrap{text-align:right;min-width:72px;flex-shrink:0}
.prog-pct{font-size:20px;font-weight:700;color:var(--text)}
.prog-bar{height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .3s}
.prog-sub{font-size:10px;color:var(--text3);margin-top:2px;display:block}

/* ── EXERCISE LIST ── */
.ex-list{padding:10px 16px 20px;display:flex;flex-direction:column;gap:10px}
@media(min-width:768px){.ex-list{padding:14px 20px 24px}}
@media(min-width:900px){.ex-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
.ex-card{background:var(--bg2);border-radius:10px;padding:12px;border:1px solid var(--card-border)}
.ex-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.ex-name{font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ex-rep{font-size:10px;font-weight:600;flex-shrink:0}
.ex-actions{display:flex;gap:4px;flex-shrink:0}
.ex-action-btn{background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text4);font-size:10px;padding:2px 6px;cursor:pointer;font-family:inherit;transition:all .15s}
.ex-action-btn.del{color:#e53e3e;border-color:#e53e3e}
.ex-search-btn{background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text4);font-size:10px;padding:2px 6px;cursor:pointer;font-family:inherit;transition:all .15s}
.set-head{display:grid;grid-template-columns:22px 1fr 1fr 34px;gap:5px;margin-bottom:4px}
.set-lbl{font-size:9px;color:var(--text4);text-align:center}
.set-row{display:grid;grid-template-columns:22px 1fr 1fr 34px;gap:5px;margin-bottom:5px;align-items:center;transition:opacity .2s}
.set-row.done{opacity:.4}
.set-num{font-size:11px;color:var(--text4);text-align:center}
.set-input{background:var(--input-bg);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-size:14px;padding:7px 3px;text-align:center;width:100%;font-family:inherit;outline:none;-webkit-appearance:none}
.set-input:focus{border-color:var(--text3)}
.chk-btn{width:34px;height:34px;border-radius:5px;border:1px solid var(--border3);background:transparent;cursor:pointer;font-size:14px;color:var(--text);display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit}
.add-set-btn{width:100%;margin-top:4px;padding:6px;background:transparent;border:1px dashed var(--border2);border-radius:6px;color:var(--text4);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
.add-ex-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;background:transparent;border:1px dashed var(--border2);border-radius:10px;color:var(--text4);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}

/* ── HISTORY ── */
.hist-wrap{padding:16px}
@media(min-width:768px){.hist-wrap{padding:20px}}
.hist-title{font-size:12px;color:var(--text4);margin-bottom:12px}
.hist-grid{display:flex;flex-direction:column;gap:10px}
@media(min-width:768px){.hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
.hist-card{background:var(--bg2);border-radius:10px;border:1px solid;padding:12px}
.hist-hd{font-size:12px;font-weight:700;margin-bottom:4px}
.hist-sub{font-size:11px;color:var(--text3);margin-bottom:8px}
.hist-ex{margin-bottom:6px}
.hist-ex-name{font-size:11px;color:var(--text3);display:block;margin-bottom:3px}
.hist-sets{display:flex;flex-wrap:wrap;gap:4px}
.hist-set{font-size:10px;background:var(--bg3);padding:2px 7px;border-radius:4px;color:var(--text2)}
.empty{color:var(--text4);font-size:12px;text-align:center;margin-top:60px;line-height:2}

/* ── SEARCH TAB ── */
.search-wrap{padding:16px}
@media(min-width:768px){.search-wrap{padding:20px}}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;padding:12px 14px;font-family:inherit;outline:none;-webkit-appearance:none}
.search-input:focus{border-color:var(--text3)}
.search-submit{padding:12px 16px;border-radius:10px;border:none;background:var(--text);color:var(--bg);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.search-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.search-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);color:var(--text3);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
.search-chip:hover{border-color:var(--text3);color:var(--text2)}
.search-results{display:flex;flex-direction:column;gap:10px}
.yt-card{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:10px;border:1px solid var(--card-border);padding:12px;cursor:pointer;text-decoration:none;transition:border-color .15s}
.yt-card:hover{border-color:var(--border3)}
.yt-thumb{width:80px;height:54px;border-radius:6px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:20px}
.yt-thumb img{width:100%;height:100%;object-fit:cover}
.yt-info{flex:1;min-width:0}
.yt-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.yt-channel{font-size:10px;color:var(--text3)}
.yt-badge{font-size:10px;color:#ff4444;font-weight:700;flex-shrink:0}
.search-empty{text-align:center;padding:40px 20px;color:var(--text4);font-size:13px;line-height:2}
.search-guide{background:var(--bg2);border-radius:10px;border:1px solid var(--card-border);padding:14px;margin-bottom:12px}
.search-guide-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px}
.search-guide-item{font-size:11px;color:var(--text3);margin-bottom:4px;display:flex;align-items:center;gap:6px}

/* ── SETTINGS ── */
.settings-wrap{padding:16px}
@media(min-width:768px){.settings-wrap{padding:20px}}
.settings-section{margin-bottom:24px}
.settings-title{font-size:10px;color:var(--text4);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.settings-card{background:var(--bg2);border-radius:10px;border:1px solid var(--border);overflow:hidden}
.settings-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:13px;color:var(--text2);flex:1}
.settings-row-sub{font-size:11px;color:var(--text4)}
.settings-input{background:var(--input-bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:6px 10px;text-align:right;width:90px;font-family:inherit;outline:none;-webkit-appearance:none}
.settings-input.wide{width:160px;text-align:left}
.settings-input.auto{width:auto;text-align:left;padding:6px 8px}
.settings-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
.settings-btn.danger{border-color:#e53e3e;color:#e53e3e}
.settings-btn.google{display:flex;align-items:center;gap:6px;border-color:#4285F4;color:#4285F4}
.day-edit-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.day-edit-row:last-child{border-bottom:none}
.day-toggle{width:36px;height:20px;border-radius:10px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.day-toggle.on{background:var(--text)}
.day-toggle.off{background:var(--border)}
.day-toggle-knob{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;transition:left .2s}
.day-toggle.on .day-toggle-knob{left:18px;background:var(--bg)}
.day-toggle.off .day-toggle-knob{left:2px;background:var(--bg2)}
.day-edit-label{font-size:13px;color:var(--text2);flex:1}
.day-edit-sub{font-size:10px;color:var(--text4)}
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.color-chip{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.color-chip.sel{border-color:var(--text)}
.icon-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.icon-chip{width:32px;height:32px;border-radius:8px;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-chip.sel{border-color:var(--text);background:var(--bg4)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
@media(min-width:768px){.modal-bg{align-items:center}}
.modal{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:20px;padding-bottom:calc(20px + var(--sab));border-top:1px solid var(--border);max-height:85dvh;overflow-y:auto}
@media(min-width:768px){.modal{border-radius:16px;max-width:420px;border:1px solid var(--border)}}
.modal-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text)}
.modal-label{font-size:11px;color:var(--text3);margin-bottom:6px;display:block}
.modal-input{width:100%;background:var(--input-bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:14px;padding:10px 12px;font-family:inherit;outline:none;margin-bottom:12px;-webkit-appearance:none}
.modal-input:focus{border-color:var(--text3)}
.modal-btns{display:flex;gap:8px;margin-top:4px}
.modal-btn{flex:1;padding:11px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.modal-btn.cancel{background:var(--bg3);color:var(--text2)}
.modal-btn.confirm{background:var(--text);color:var(--bg)}
.modal-btn.del-confirm{background:#e53e3e;color:#fff}

/* ── SYNC STATUS ── */
.sync-indicator{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text4);padding:4px 0}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#4ade80}
.sync-dot.syncing{background:#f59e0b;animation:pulse .8s infinite}
.sync-dot.error{background:#e53e3e}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(80px + var(--sab));left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:8px 16px;border-radius:20px;opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:768px){.toast{bottom:30px}}
</style>
</head>
<body>
<div id="app">

    <div class="sb-user" id="sb-user" onclick="showTab('settings')">

    <div class="sb-nav">

  <div id="main">

      </div>
      <div class="mh-tabs">
        <button class="mh-tab act" onclick="showTab('workout',this)">운동</button>
        <button class="mh-tab" onclick="showTab('history',this)">기록</button>
        <button class="mh-tab" onclick="showTab('search',this)">검색</button>
        <button class="mh-tab" onclick="showTab('settings',this)">설정</button>

    <div id="scroll">
      <div id="page-workout" class="page act"></div>
      <div id="page-history" class="page"></div>
      <div id="page-search" class="page"></div>
      <div id="page-settings" class="page"></div>
    </div>

    <div id="bt">
      <button class="bt-btn act" onclick="showTab('workout',this)"><span class="bt-icon">🏋️</span>운동</button>
      <button class="bt-btn" onclick="showTab('history',this)"><span class="bt-icon">📋</span>기록</button>
      <button class="bt-btn" onclick="showTab('search',this)"><span class="bt-icon">🔍</span>검색</button>
      <button class="bt-btn" onclick="showTab('settings',this)"><span class="bt-icon">⚙️</span>설정</button>
    </div>
  </div>
</div>

<div id="modal-bg" class="modal-bg" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ── Firebase 설정 ──
const firebaseConfig = {
  apiKey: "AIzaSyBMaEjqbG3XNqMF5nIRKvRLgVJG10bRxWY",
  authDomain: "ironlog-53d91.firebaseapp.com",
  projectId: "ironlog-53d91",
  storageBucket: "ironlog-53d91.firebasestorage.app",
  messagingSenderId: "374687474423",
  appId: "1:374687474423:web:bcc7388e7dcab8cc4929f2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ── 전역 노출 ──
window._fb = { auth, db, GoogleAuthProvider, signInWithPopup, signOut, doc, getDoc, setDoc, onSnapshot };

// ── 인증 상태 감지 ──
onAuthStateChanged(auth, user => {
  window._currentUser = user;
  window._onAuthReady && window._onAuthReady(user);
});
</script>

<script>
// ── 기본 데이터 ──
const DEFAULT_ROUTINE = {
  월:{label:'상체 Push',color:'#FF6B35',icon:'💪',desc:'가슴 · 어깨 · 삼두',active:true,exercises:[
    {name:'바벨 벤치프레스',sets:4,rep:'6–8'},{name:'인클라인 덤벨 프레스',sets:3,rep:'8–10'},
    {name:'케이블 플라이',sets:3,rep:'12–15'},{name:'덤벨 숄더프레스',sets:3,rep:'8–10'},
    {name:'레터럴 레이즈',sets:3,rep:'12–15'},{name:'트라이셉스 푸시다운',sets:3,rep:'12–15'},
  ]},
  화:{label:'하체 + 코어',color:'#4ECDC4',icon:'🦵',desc:'대퇴 · 햄스트링 · 코어',active:true,exercises:[
    {name:'바벨 스쿼트',sets:4,rep:'6–8'},{name:'루마니안 데드리프트',sets:3,rep:'8–10'},
    {name:'레그 프레스',sets:3,rep:'10–12'},{name:'레그 컬 (머신)',sets:3,rep:'12–15'},
    {name:'카프 레이즈',sets:4,rep:'15–20'},{name:'플랭크',sets:3,rep:'60초'},
  ]},
  수:{label:'휴식',color:'#555',icon:'🛌',desc:'',active:false,exercises:[]},
  목:{label:'상체 Pull',color:'#A855F7',icon:'🏋️',desc:'등 · 이두',active:true,exercises:[
    {name:'바벨 데드리프트',sets:4,rep:'5–6'},{name:'렛풀다운',sets:3,rep:'8–10'},
    {name:'시티드 케이블 로우',sets:3,rep:'10–12'},{name:'덤벨 원암 로우',sets:3,rep:'10–12'},
    {name:'페이스풀',sets:3,rep:'15'},{name:'바벨 컬',sets:3,rep:'10–12'},
  ]},
  금:{label:'하체 + 어깨 보조',color:'#F59E0B',icon:'⚡',desc:'하체 · 후면 삼각근',active:true,exercises:[
    {name:'핵 스쿼트',sets:4,rep:'8–10'},{name:'불가리안 스플릿 스쿼트',sets:3,rep:'10 (각)'},
    {name:'레그 익스텐션',sets:3,rep:'12–15'},{name:'시티드 카프 레이즈',sets:3,rep:'15–20'},
    {name:'리어 델트 플라이',sets:3,rep:'15'},{name:'업라이트 로우',sets:3,rep:'12'},
  ]},
  토:{label:'휴식',color:'#555',icon:'🛌',desc:'',active:false,exercises:[]},
  일:{label:'휴식',color:'#555',icon:'🛌',desc:'',active:false,exercises:[]},
};
const DEFAULT_PROFILE = {name:'',weight:80,height:180,theme:'system'};

const DAYS = ['월','화','수','목','금','토','일'];
const COLORS = ['#FF6B35','#4ECDC4','#A855F7','#F59E0B','#3B82F6','#10B981','#EC4899','#F43F5E','#8B5CF6','#06B6D4'];
const ICONS = ['💪','🦵','🏋️','⚡','🔥','🎯','💥','🏃','🧘','🛌'];
const LOCAL_KEY = 'ironlog_v4';

// ── 상태 ──
let profile = {...DEFAULT_PROFILE};
let routineDays = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
let workoutLog = {};
let selDay = '월';
let curTab = 'workout';
let syncUnsubscribe = null;
let saveTimer = null;
let isSyncing = false;

// ── 로컬 저장/불러오기 ──
function saveLocal() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify({profile, routineDays, workoutLog}));
}
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}');
    if(d.profile) profile = {...DEFAULT_PROFILE, ...d.profile};
    if(d.routineDays) routineDays = d.routineDays;
    if(d.workoutLog) workoutLog = d.workoutLog;
  } catch{}
}

// ── Firebase 동기화 ──
async function startSync(user) {
  if(syncUnsubscribe) syncUnsubscribe();
  setSyncStatus('syncing');
  const {db, doc, onSnapshot} = window._fb;
  const ref = doc(db, 'users', user.uid, 'data', 'main');
  syncUnsubscribe = onSnapshot(ref, snap => {
    if(snap.exists()) {
      const d = snap.data();
      if(d.profile) profile = {...DEFAULT_PROFILE, ...d.profile};
      if(d.routineDays) routineDays = d.routineDays;
      if(d.workoutLog) workoutLog = d.workoutLog;
      saveLocal();
      renderAll();
    }
    setSyncStatus('ok');
  }, () => setSyncStatus('error'));
}

function stopSync() {
  if(syncUnsubscribe){syncUnsubscribe();syncUnsubscribe=null;}
  setSyncStatus('off');
}

async function pushToFirebase() {
  const user = window._currentUser;
  if(!user) return;
  setSyncStatus('syncing');
  try {
    const {db, doc, setDoc} = window._fb;
    await setDoc(doc(db,'users',user.uid,'data','main'), {profile, routineDays, workoutLog});
    setSyncStatus('ok');
  } catch { setSyncStatus('error'); }
}

function schedulePush() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushToFirebase, 1500);
}

function setSyncStatus(status) {
  isSyncing = status === 'syncing';
  const dot1 = document.getElementById('sb-sync-dot');
  const dot2 = document.getElementById('mh-sync');
  [dot1, dot2].forEach(d => {
    if(!d) return;
    d.className = d.id === 'sb-sync-dot' ? 'sb-sync-dot' : 'mh-sync';
    if(status==='ok') {}
    else if(status==='syncing'){d.classList.add('syncing')}
    else if(status==='error'){d.classList.add('error')}
    else{d.classList.add('off')}
  });
}

// ── Auth ──
window._onAuthReady = async (user) => {
  if(user) {
    // 로그인됨
    const avatar = user.photoURL;
    ['sb-avatar','mh-avatar'].forEach(id => {
      const el = document.getElementById(id);
      if(!el) return;
      el.innerHTML = avatar ? `<img src="${avatar}">` : user.displayName?.[0]||'👤';
    });
    document.getElementById('sb-name').textContent = user.displayName || user.email;
    document.getElementById('sb-sub').textContent = '동기화 중';
    startSync(user);
  } else {
    // 비로그인
    ['sb-avatar','mh-avatar'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.innerHTML = '👤';
    });
    document.getElementById('sb-name').textContent = profile.name || '로그인 필요';
    document.getElementById('sb-sub').textContent = '설정에서 로그인';
    stopSync();
  }
  renderAll();
};

async function googleLogin() {
  try {
    const {auth, GoogleAuthProvider, signInWithPopup} = window._fb;
    await signInWithPopup(auth, new GoogleAuthProvider());
    toast('로그인되었습니다 ✓');
  } catch(e) {
    toast('로그인 실패: ' + e.message);
  }
}

async function googleLogout() {
  const {auth, signOut} = window._fb;
  await signOut(auth);
  toast('로그아웃되었습니다');
  renderSettings();
}

// ── 저장 (로컬 + Firebase) ──
function save() {
  saveLocal();
  if(window._currentUser) schedulePush();
}

// ── 유틸 ──
function todayDow(){return DAYS[new Date().getDay()===0?6:new Date().getDay()-1];}
function getDateKey(day){
  const t=new Date(),ti=t.getDay()===0?6:t.getDay()-1;
  const d=new Date(t);d.setDate(t.getDate()+(DAYS.indexOf(day)-ti));
  return d.toISOString().slice(0,10);
}
function getEntry(dk,ei,si){return workoutLog?.[dk]?.[ei]?.[si]||{weight:'',reps:'',done:false};}
function setEntry(dk,ei,si,field,val){
  if(!workoutLog[dk])workoutLog[dk]={};
  if(!workoutLog[dk][ei])workoutLog[dk][ei]={};
  if(!workoutLog[dk][ei][si])workoutLog[dk][ei][si]={weight:'',reps:'',done:false};
  workoutLog[dk][ei][si][field]=val;
  save();
}
function calcProg(dk,r){
  if(!r?.active)return{done:0,total:0};
  let done=0,total=0;
  r.exercises.forEach((ex,ei)=>{for(let si=0;si<ex.sets;si++){total++;if(getEntry(dk,ei,si).done)done++;}});
  return{done,total};
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function renderAll(){renderSidebar();renderWorkout();}

// ── 탭 ──
function showTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.mh-tab,.bt-btn,.sb-nav-btn').forEach(b=>b.classList.remove('act'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('act'));
  document.getElementById('page-'+tab).classList.add('act');
  const idx={workout:0,history:1,search:2,settings:3}[tab];
  document.querySelectorAll('.mh-tab')[idx]?.classList.add('act');
  document.querySelectorAll('.bt-btn')[idx]?.classList.add('act');
  document.querySelectorAll('.sb-nav-btn')[idx]?.classList.add('act');
  if(btn)btn.classList.add('act');
  if(tab==='history')renderHistory();
  if(tab==='search')renderSearch();
  if(tab==='settings')renderSettings();
  document.getElementById('scroll').scrollTop=0;
}

// ── 사이드바 ──
function renderSidebar(){
  const today=todayDow();
  let html='';
  DAYS.forEach(d=>{
    const r=routineDays[d];
    const isSel=d===selDay,isToday=d===today;
    const color=r?.color||'#555';
    html+=`<div class="sb-day${!r?.active?' rest':''}${isSel?' sel':''}" style="--day-color:${color}" onclick="selectDay('${d}')">
      <div class="sb-dot"></div>
      <div style="min-width:0">
        <div class="sb-day-name">${d} ${r?.label||'휴식'}</div>
        ${r?.desc?`<div class="sb-day-sub">${r.desc}</div>`:''}
      </div>
      ${isToday?'<span class="sb-today">TODAY</span>':''}
    </div>`;
  });
  document.getElementById('sb-days').innerHTML=html;
}

function selectDay(d){
  if(!routineDays[d]?.active)return;
  selDay=d;renderSidebar();renderWorkout();
  if(curTab!=='workout')showTab('workout');
}

// ── 운동 페이지 ──
function esc(str){return str.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}

function renderWorkout(){
  const dk=getDateKey(selDay),r=routineDays[selDay],today=todayDow();
  const {done,total}=calcProg(dk,r),pct=total>0?Math.round(done/total*100):0;
  let html='';

  html+='<div class="day-row">';
  DAYS.forEach(d=>{
    const isA=routineDays[d]?.active,isSel=d===selDay,isToday=d===today;
    const color=routineDays[d]?.color||'#555';
    html+=`<button class="day-btn${!isA?' rest':''}${isSel?' sel':''}"
      style="${isSel?`border-color:${color};color:${color}`:''}"
      onclick="selectDay('${d}')">${d}${isToday?'<span class="today-dot"></span>':''}</button>`;
  });
  html+='</div>';

  if(!r?.active){
    html+='<p class="empty">오늘은 휴식일입니다 🛌<br><small>설정에서 운동 요일을 변경할 수 있습니다</small></p>';
  } else {
    html+=`<div class="r-header" style="border-color:${r.color}">
      <div class="r-left">
        <div class="r-icon-row"><span class="r-icon">${r.icon}</span><span class="r-label" style="color:${r.color}">${r.label}</span></div>
        ${r.desc?`<div class="r-desc">${r.desc}</div>`:''}
        <div class="r-edit" onclick="modalEditDay('${selDay}')">✏️ 루틴 편집</div>
      </div>
      <div class="prog-wrap">
        <span class="prog-pct">${pct}%</span>
        <div class="prog-bar"><div class="prog-fill" id="pfill" style="width:${pct}%;background:${r.color}"></div></div>
        <span class="prog-sub">${done}/${total} 세트</span>
      </div>
    </div>`;

    html+='<div class="ex-list">';
    r.exercises.forEach((ex,ei)=>{
      html+=`<div class="ex-card">
        <div class="ex-top">
          <span class="ex-name">${ex.name}</span>
          <span class="ex-rep" style="color:${r.color}">${ex.rep}</span>
          <div class="ex-actions">
            <button class="ex-search-btn" onclick="searchExercise('${esc(ex.name)}')">🔍</button>
            <button class="ex-action-btn" onclick="modalEditEx('${selDay}',${ei})">편집</button>
            <button class="ex-action-btn del" onclick="deleteEx('${selDay}',${ei})">삭제</button>
          </div>
        </div>
        <div class="set-head"><span class="set-lbl">세트</span><span class="set-lbl">무게kg</span><span class="set-lbl">횟수</span><span class="set-lbl">완료</span></div>`;
      for(let si=0;si<ex.sets;si++){
        const e=getEntry(dk,ei,si);
        html+=`<div class="set-row${e.done?' done':''}" id="row-${ei}-${si}">
          <span class="set-num">${si+1}</span>
          <input class="set-input" type="number" inputmode="decimal" placeholder="—" value="${e.weight}"
            onblur="setEntry('${dk}',${ei},${si},'weight',this.value)">
          <input class="set-input" type="number" inputmode="numeric" placeholder="—" value="${e.reps}"
            onblur="setEntry('${dk}',${ei},${si},'reps',this.value)">
          <button class="chk-btn" id="chk-${ei}-${si}"
            style="background:${e.done?r.color:'transparent'};border-color:${e.done?r.color:'var(--border3)'}"
            onclick="toggleDone('${dk}',${ei},${si},'${r.color}')">
            ${e.done?'✓':''}
          </button>
        </div>`;
      }
      html+=`<button class="add-set-btn" onclick="addSet('${selDay}',${ei})">+ 세트 추가</button></div>`;
    });
    html+=`<button class="add-ex-btn" onclick="modalAddEx('${selDay}')">＋ 운동 추가</button></div>`;
  }
  document.getElementById('page-workout').innerHTML=html;
}

function addSet(day,ei){routineDays[day].exercises[ei].sets++;save();renderWorkout();}

function toggleDone(dk,ei,si,color){
  const cur=getEntry(dk,ei,si),nd=!cur.done;
  setEntry(dk,ei,si,'done',nd);
  const row=document.getElementById(`row-${ei}-${si}`),btn=document.getElementById(`chk-${ei}-${si}`);
  if(row)row.classList.toggle('done',nd);
  if(btn){btn.style.background=nd?color:'transparent';btn.style.borderColor=nd?color:'var(--border3)';btn.textContent=nd?'✓':'';}
  const {done,total}=calcProg(getDateKey(selDay),routineDays[selDay]);
  const pct=total>0?Math.round(done/total*100):0;
  const fill=document.getElementById('pfill');if(fill)fill.style.width=pct+'%';
  const pEl=document.querySelector('.prog-pct');if(pEl)pEl.textContent=pct+'%';
  const sEl=document.querySelector('.prog-sub');if(sEl)sEl.textContent=`${done}/${total} 세트`;
}

function deleteEx(day,ei){
  const name=routineDays[day].exercises[ei].name;
  openModal(`<div class="modal-title">운동 삭제</div>
    <p style="font-size:13px;color:var(--text3);margin-bottom:20px">"${name}"을(를) 삭제할까요?</p>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">취소</button>
      <button class="modal-btn del-confirm" onclick="confirmDeleteEx('${esc(day)}',${ei})">삭제</button>
    </div>`);
}
function confirmDeleteEx(day,ei){routineDays[day].exercises.splice(ei,1);save();closeModal();renderWorkout();toast('삭제되었습니다');}

function modalEditEx(day,ei){
  const ex=routineDays[day].exercises[ei];
  openModal(`<div class="modal-title">운동 편집</div>
    <label class="modal-label">운동 이름</label>
    <input class="modal-input" id="m-ex-name" value="${esc(ex.name)}">
    <label class="modal-label">목표 횟수</label>
    <input class="modal-input" id="m-ex-rep" value="${esc(ex.rep)}">
    <label class="modal-label">세트 수</label>
    <input class="modal-input" id="m-ex-sets" type="number" value="${ex.sets}" min="1" max="10">
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">취소</button>
      <button class="modal-btn confirm" onclick="confirmEditEx('${esc(day)}',${ei})">저장</button>
    </div>`);
}
function confirmEditEx(day,ei){
  const name=document.getElementById('m-ex-name').value.trim();
  const rep=document.getElementById('m-ex-rep').value.trim();
  const sets=parseInt(document.getElementById('m-ex-sets').value)||3;
  if(!name){toast('이름을 입력해주세요');return;}
  routineDays[day].exercises[ei]={...routineDays[day].exercises[ei],name,rep,sets};
  save();closeModal();renderWorkout();toast('저장되었습니다');
}

function modalAddEx(day){
  openModal(`<div class="modal-title">운동 추가</div>
    <label class="modal-label">운동 이름</label>
    <input class="modal-input" id="m-new-name" placeholder="예: 덤벨 컬">
    <label class="modal-label">목표 횟수</label>
    <input class="modal-input" id="m-new-rep" placeholder="예: 10–12">
    <label class="modal-label">세트 수</label>
    <input class="modal-input" id="m-new-sets" type="number" value="3" min="1">
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">취소</button>
      <button class="modal-btn confirm" onclick="confirmAddEx('${day}')">추가</button>
    </div>`);
  setTimeout(()=>document.getElementById('m-new-name')?.focus(),100);
}
function confirmAddEx(day){
  const name=document.getElementById('m-new-name').value.trim();
  const rep=document.getElementById('m-new-rep').value.trim()||'—';
  const sets=parseInt(document.getElementById('m-new-sets').value)||3;
  if(!name){toast('이름을 입력해주세요');return;}
  routineDays[day].exercises.push({name,rep,sets});
  save();closeModal();renderWorkout();toast('운동이 추가되었습니다');
}

let _selColor=null,_selIcon=null;
function modalEditDay(day){
  const r=routineDays[day];
  const colorBtns=COLORS.map(c=>`<div class="color-chip${r.color===c?' sel':''}" style="background:${c}" onclick="selectColor('${c}',this)"></div>`).join('');
  const iconBtns=ICONS.map(i=>`<div class="icon-chip${r.icon===i?' sel':''}" onclick="selectIcon('${i}',this)">${i}</div>`).join('');
  openModal(`<div class="modal-title">${day}요일 루틴 편집</div>
    <label class="modal-label">루틴 이름</label>
    <input class="modal-input" id="m-day-label" value="${esc(r.label)}">
    <label class="modal-label">설명</label>
    <input class="modal-input" id="m-day-desc" value="${esc(r.desc||'')}">
    <label class="modal-label">색상</label>
    <div class="color-row" id="color-row">${colorBtns}</div>
    <label class="modal-label">아이콘</label>
    <div class="icon-row" id="icon-row">${iconBtns}</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">취소</button>
      <button class="modal-btn confirm" onclick="confirmEditDay('${esc(day)}')">저장</button>
    </div>`);
}
function selectColor(c,el){_selColor=c;document.querySelectorAll('.color-chip').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');}
function selectIcon(i,el){_selIcon=i;document.querySelectorAll('.icon-chip').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');}
function confirmEditDay(day){
  const label=document.getElementById('m-day-label').value.trim();
  const desc=document.getElementById('m-day-desc').value.trim();
  if(!label){toast('이름을 입력해주세요');return;}
  const r=routineDays[day];
  r.label=label;r.desc=desc;
  if(_selColor)r.color=_selColor;
  if(_selIcon)r.icon=_selIcon;
  _selColor=null;_selIcon=null;
  save();closeModal();renderWorkout();renderSidebar();toast('저장되었습니다');
}

// ── 기록 페이지 ──
function renderHistory(){
  const dates=Object.keys(workoutLog).sort().reverse().slice(0,30);
  let html='<div class="hist-wrap"><p class="hist-title">최근 운동 기록</p>';
  if(!dates.length){html+='<p class="empty">아직 기록이 없습니다.</p></div>';
    document.getElementById('page-history').innerHTML=html;return;}
  html+='<div class="hist-grid">';
  dates.forEach(dk=>{
    const d=new Date(dk),dow=DAYS[d.getDay()===0?6:d.getDay()-1];
    const r=routineDays[dow];if(!r?.active)return;
    const dayLog=workoutLog[dk];let exHtml='',hasData=false;
    r.exercises.forEach((ex,ei)=>{
      const sets=dayLog?.[ei];if(!sets)return;
      const entries=Object.entries(sets).filter(([,s])=>s.weight||s.reps);if(!entries.length)return;
      hasData=true;
      exHtml+=`<div class="hist-ex"><span class="hist-ex-name">${ex.name}</span>
        <div class="hist-sets">${entries.map(([,s])=>`<span class="hist-set">${s.weight||'?'}kg×${s.reps||'?'}${s.done?' ✓':''}</span>`).join('')}</div></div>`;
    });
    if(!hasData)return;
    html+=`<div class="hist-card" style="border-color:${r.color}">
      <div class="hist-hd" style="color:${r.color}">${r.icon} ${dk} (${dow})</div>
      <div class="hist-sub">${r.label}</div>${exHtml}</div>`;
  });
  html+='</div></div>';
  document.getElementById('page-history').innerHTML=html;
}

// ── 운동 검색 페이지 ──
const QUICK_SEARCHES = ['벤치프레스','스쿼트','데드리프트','풀업','숄더프레스','레터럴 레이즈','바벨 컬','플랭크'];

function renderSearch(){
  let html=`<div class="search-wrap">
    <div class="search-bar">
      <input class="search-input" id="search-input" placeholder="운동 이름을 검색하세요" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-submit" onclick="doSearch()">검색</button>
    </div>
    <div class="search-chips">
      ${QUICK_SEARCHES.map(q=>`<button class="search-chip" onclick="quickSearch('${q}')">${q}</button>`).join('')}
    </div>
    <div class="search-guide">
      <div class="search-guide-title">💡 이렇게 사용하세요</div>
      <div class="search-guide-item">🔍 운동 이름 입력 → YouTube 영상 목록</div>
      <div class="search-guide-item">▶️ 카드 탭하면 YouTube 앱으로 이동</div>
      <div class="search-guide-item">🏋️ 운동 카드의 🔍 버튼으로도 바로 검색</div>
    </div>
    <div id="search-results"></div>
  </div>`;
  document.getElementById('page-search').innerHTML=html;
}

function quickSearch(q){
  const input=document.getElementById('search-input');
  if(input)input.value=q;
  doSearch(q);
}

function searchExercise(name){
  showTab('search');
  setTimeout(()=>{
    const input=document.getElementById('search-input');
    if(input)input.value=name;
    doSearch(name);
  },100);
}

function doSearch(query){
  const q=query||document.getElementById('search-input')?.value?.trim();
  if(!q)return;
  const resultsEl=document.getElementById('search-results');
  if(!resultsEl)return;

  // YouTube 검색어 구성 (한국어 운동 방법)
  const searchQuery=encodeURIComponent(q+' 운동 방법 how to');
  const ytSearchUrl=`https://www.youtube.com/results?search_query=${searchQuery}`;

  // 추천 채널 링크 생성
  const channels=[
    {name:'유튜브 검색 전체',url:ytSearchUrl,desc:'YouTube에서 "'+q+' 운동 방법" 검색'},
    {name:'Jeff Nippard',url:`https://www.youtube.com/@JeffNippard/search?query=${encodeURIComponent(q)}`,desc:'근거 기반 운동 정보 (영어)'},
    {name:'핏블리',url:`https://www.youtube.com/@fitbly/search?query=${encodeURIComponent(q)}`,desc:'한국어 운동 설명'},
    {name:'강경원',url:`https://www.youtube.com/@kangkyungwon/search?query=${encodeURIComponent(q)}`,desc:'한국어 헬스 유튜버'},
  ];

  let html=`<div style="font-size:11px;color:var(--text4);margin-bottom:10px">"${q}" 검색 결과</div>`;

  // 메인 YouTube 검색 카드
  html+=`<a class="yt-card" href="${ytSearchUrl}" target="_blank" rel="noopener">
    <div class="yt-thumb" style="background:#ff4444">
      <svg width="28" height="20" viewBox="0 0 28 20" fill="white"><path d="M27.4 3.1c-.3-1.2-1.3-2.2-2.5-2.5C22.7 0 14 0 14 0S5.3 0 3.1.6C1.9.9.9 1.9.6 3.1 0 5.3 0 10 0 10s0 4.7.6 6.9c.3 1.2 1.3 2.2 2.5 2.5C5.3 20 14 20 14 20s8.7 0 10.9-.6c1.2-.3 2.2-1.3 2.5-2.5C28 14.7 28 10 28 10s0-4.7-.6-6.9zM11.2 14.3V5.7L18.5 10l-7.3 4.3z"/></svg>
    </div>
    <div class="yt-info">
      <div class="yt-title">${q} 운동 방법 검색하기</div>
      <div class="yt-channel">YouTube · 검색 결과 전체 보기</div>
    </div>
    <div class="yt-badge">▶</div>
  </a>`;

  // 채널별 검색 카드
  html+=`<div style="font-size:11px;color:var(--text4);margin:14px 0 8px">채널별 검색</div>`;
  channels.slice(1).forEach(ch=>{
    html+=`<a class="yt-card" href="${ch.url}" target="_blank" rel="noopener">
      <div class="yt-thumb" style="font-size:13px;color:var(--text3)">📺</div>
      <div class="yt-info">
        <div class="yt-title">${ch.name}에서 "${q}" 검색</div>
        <div class="yt-channel">${ch.desc}</div>
      </div>
      <div class="yt-badge">▶</div>
    </a>`;
  });

  resultsEl.innerHTML=html;
}

// ── 설정 페이지 ──

  const user=window._currentUser;
  const p=profile;
  let html=`<div class="settings-wrap">

    html+=`<div class="settings-row">

      </div>`;
  } else {
    html+=`<div class="settings-row">
        <span class="settings-row-label">Google 계정으로 로그인하면<br><small style="color:var(--text4)">아이폰·아이패드 간 자동 동기화</small></span>

          Google 로그인
        </button>
      </div>`;
  }
  html+=`</div></div>

    <div class="settings-section">
      <div class="settings-title">테마</div>
      <div class="settings-card">
        <div class="settings-row">
          <span class="settings-row-label">색상 모드</span>
          <select class="settings-input auto" id="s-theme" onchange="applyTheme(this.value)">
            <option value="system" ${p.theme==='system'?'selected':''}>🌗 시스템 설정</option>
            <option value="dark" ${p.theme==='dark'?'selected':''}>🌑 항상 다크</option>

          <span class="settings-row-label">이름</span>
          <input class="settings-input wide" id="s-name" value="${p.name||''}" placeholder="이름" onblur="saveProfile()">

        <div class="settings-row">
          <span class="settings-row-label">몸무게</span>

function saveProfile(){
  profile.name=document.getElementById('s-name')?.value.trim()||'';
  profile.weight=parseFloat(document.getElementById('s-weight')?.value)||0;
  profile.height=parseFloat(document.getElementById('s-height')?.value)||0;
  save();
  document.getElementById('sb-name').textContent=profile.name||window._currentUser?.displayName||'로그인 필요';
  toast('저장되었습니다');
}

function toggleDay(day,btn){
  const r=routineDays[day];
  r.active=!r.active;
  if(r.active&&r.exercises.length===0){r.label='새 루틴';r.color='#3B82F6';r.icon='💪';}
  if(!r.active){r.label='휴식';r.icon='🛌';}
  save();renderSettings();renderSidebar();
}

function applyTheme(theme){
  profile.theme=theme;save();
  if(theme==='system')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',theme);
  const isDark = theme==='dark' || (theme==='system' && window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark?'#0a0a0a':'#f5f5f5');
  toast(theme==='system'?'시스템 설정 따름':theme==='dark'?'다크 모드':'라이트 모드');
}

function confirmResetLog(){
  openModal(`<div class="modal-title">운동 기록 초기화</div>
    <p style="font-size:13px;color:var(--text3);margin-bottom:20px">모든 운동 기록이 삭제됩니다. 루틴은 유지됩니다.</p>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">취소</button>
      <button class="modal-btn del-confirm" onclick="doResetLog()">초기화</button>
    </div>`);
}
function doResetLog(){workoutLog={};save();closeModal();toast('기록이 초기화되었습니다');}

function confirmResetAll(){
  openModal(`<div class="modal-title">전체 초기화</div>
    <p style="font-size:13px;color:var(--text3);margin-bottom:20px">루틴과 모든 기록이 삭제됩니다.</p>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">취소</button>
      <button class="modal-btn del-confirm" onclick="doResetAll()">초기화</button>
    </div>`);
}
function doResetAll(){
  routineDays=JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
  workoutLog={};profile={...DEFAULT_PROFILE};
  save();closeModal();renderAll();renderSettings();toast('초기화되었습니다');
}

// ── 모달 ──
function openModal(content){
  _selColor=null;_selIcon=null;
  document.getElementById('modal').innerHTML=content;
  document.getElementById('modal-bg').style.display='flex';
}
function closeModal(e){
  if(e&&e.target!==document.getElementById('modal-bg'))return;
  document.getElementById('modal-bg').style.display='none';
}

// ── 초기화 ──
loadLocal();
if(profile.theme&&profile.theme!=='system')document.documentElement.setAttribute('data-theme',profile.theme);
selDay=DAYS.find(d=>routineDays[d]?.active&&d===todayDow())||DAYS.find(d=>routineDays[d]?.active)||'월';
renderSidebar();
renderWorkout();
</script>
